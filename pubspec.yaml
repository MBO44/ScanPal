name: scanpal
description: Receipt and document scanner with CSV export and PDF signing.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cunning_document_scanner: ^3.0.4
  google_mlkit_text_recognition: ^0.17.1
  pdf: ^3.10.8
  path_provider: ^2.1.3
  share_plus: ^13.3.1
  shared_preferences: ^2.2.3
  signature: ^6.4.0
  purchases_flutter: ^10.18.1
flutter:
  uses-material-design: true
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
